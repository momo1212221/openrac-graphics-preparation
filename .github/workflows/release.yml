name: release

"on":
  push:
    branches:
      - main
      - unified-product
  workflow_dispatch: {}

concurrency:
  group: release-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: macos-x86_64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Fetch official SDK
        shell: bash
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build unified native runtime
        shell: bash
        run: cmake --build build --target graphics_preparation_runtime --parallel
      - name: Normalize package text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("build/package/graphics_preparation_runtime")
          paths=[root/"openrac-mod.json"]
          for pattern in ("README*","LICENSE*","COPYING*"):
              paths.extend(root.glob(pattern))
          for path in paths:
              if path.is_file():
                  path.write_bytes(path.read_bytes().replace(b"\r\n",b"\n").replace(b"\r",b"\n"))
          PY
      - name: Package platform
        shell: bash
        run: |
          mkdir -p native-dist
          python "$SDK/tools/package_mod.py" build/package/graphics_preparation_runtime -o native-dist
          ls -lh native-dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: native-dist/*.zip

  release:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download native platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true
      - name: Fetch official SDK
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Merge native platforms
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')"
          python "$SDK/tools/package_mod.py" --merge native-dist/graphics-preparation-"$VERSION"-*.zip -o native-dist/graphics-preparation-"$VERSION"-native.zip
          rm -rf native-package
          mkdir native-package
          python - <<'PY'
          import zipfile
          from pathlib import Path
          zips=sorted(Path("native-dist").glob("graphics-preparation-*-native.zip"))
          assert len(zips)==1, zips
          with zipfile.ZipFile(zips[0]) as z:
              z.extractall("native-package")
          PY
      - name: Install pinned ONNX Runtime Web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Bundle standard-launcher WASM runtime
        run: npm run prepare:webai
      - name: Download pinned Real-ESRGAN x4plus ONNX model
        run: |
          mkdir -p models
          curl -L --fail --retry 5 --output models/realesrgan-x4plus.onnx             "https://huggingface.co/qualcomm/Real-ESRGAN-x4plus/resolve/725b1db7360e0befb85be5ca9924d8c1e9b1b229/Real-ESRGAN-x4plus.onnx"
          echo "a64fb7ec8780e6e67a99cf380067961a0aab618c934171240eea2724217fd304  models/realesrgan-x4plus.onnx" | sha256sum -c -
      - name: Download pinned Real-ESRGAN General x4v3 detail/fidelity CNN
        run: |
          mkdir -p models
          curl -L --fail --retry 5 --output models/realesrgan-general-x4v3.onnx             "https://huggingface.co/qualcomm/Real-ESRGAN-General-x4v3/resolve/fe119b62b7cb27c3fa5fd3d992122f8e5a3a52c4/Real-ESRGAN-General-x4v3.onnx"
          echo "bea98dff749104082449888501454b85a05ace135c89249599caec7ef2dace23  models/realesrgan-general-x4v3.onnx" | sha256sum -c -
      - name: Install CNN runtime test dependencies
        run: python -m pip install "numpy>=2.0,<3" "onnxruntime>=1.20,<2"
      - name: Test bundled CNN models
        run: python tools/training/test_runtime_models.py models/realesrgan-x4plus.onnx models/realesrgan-general-x4v3.onnx --output cnn-test-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cnn-test-report
          path: cnn-test-report.json
          if-no-files-found: warn
      - name: Test
        run: node --test
      - name: Build one-product release artifact
        env:
          OPENRAC_REQUIRE_AI_ASSETS: "1"
          OPENRAC_REQUIRE_NATIVE: "1"
          OPENRAC_NATIVE_PACKAGE: native-package
        run: python3 tools/package.py
      - name: Read version
        id: version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify launcher platform assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/graphics-preparation-$VERSION.zip"
          for PLATFORM in linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 windows-x86_64; do
            test -f "dist/graphics-preparation-$VERSION-$PLATFORM.zip"
            grep -F "  graphics-preparation-$VERSION-$PLATFORM.zip" dist/SHA256SUMS >/dev/null
          done
          grep -F "  graphics-preparation-$VERSION.zip" dist/SHA256SUMS >/dev/null
      - name: Publish current release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            "dist/graphics-preparation-$VERSION.zip" \
            "dist/graphics-preparation-$VERSION-linux-x86_64.zip" \
            "dist/graphics-preparation-$VERSION-linux-aarch64.zip" \
            "dist/graphics-preparation-$VERSION-macos-arm64.zip" \
            "dist/graphics-preparation-$VERSION-macos-x86_64.zip" \
            "dist/graphics-preparation-$VERSION-windows-x86_64.zip" \
            "dist/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "Graphics preparation $VERSION" \
            --notes-file .github/release-current.md
