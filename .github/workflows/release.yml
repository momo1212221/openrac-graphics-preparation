name: release

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          node --test
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build release artifacts
        run: python3 tools/package.py

      - name: Read version
        id: version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish current release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
            exit 0
          fi

          gh release create "$TAG"             "dist/graphics-preparation-$VERSION.zip"             "dist/SHA256SUMS"             --target "$GITHUB_SHA"             --title "Graphics preparation $VERSION"             --notes-file .github/release-current.md
