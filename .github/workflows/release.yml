name: release

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned ONNX Runtime Web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Bundle standard-launcher WASM runtime
        run: npm run prepare:webai

      - name: Download pinned Real-ESRGAN x4plus ONNX model
        run: |
          mkdir -p models
          curl -L --fail --retry 5 --output models/realesrgan-x4plus.onnx             "https://huggingface.co/qualcomm/Real-ESRGAN-x4plus/resolve/725b1db7360e0befb85be5ca9924d8c1e9b1b229/Real-ESRGAN-x4plus.onnx"
          echo "a64fb7ec8780e6e67a99cf380067961a0aab618c934171240eea2724217fd304  models/realesrgan-x4plus.onnx" | sha256sum -c -

      - name: Test
        run: node --test

      - name: Build release artifact
        env:
          OPENRAC_REQUIRE_AI_ASSETS: "1"
        run: python3 tools/package.py

      - name: Read version
        id: version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish current release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
            exit 0
          fi
          gh release create "$TAG"             "dist/graphics-preparation-$VERSION.zip"             "dist/SHA256SUMS"             --target "$GITHUB_SHA"             --title "Graphics preparation $VERSION"             --notes-file .github/release-current.md
