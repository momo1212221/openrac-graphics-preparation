name: mod
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:webai
      - run: node --test
      - name: Native runtime smoke build
        run: |
          python -m pip install ninja
          echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Configure integrated runtime
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build integrated runtime
        run: cmake --build build --target graphics_preparation_runtime --parallel
      - name: Package Linux smoke artifact
        env:
          OPENRAC_NATIVE_PACKAGE: build/package/graphics_preparation_runtime
        run: python tools/package.py
