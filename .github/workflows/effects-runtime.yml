name: effects-runtime

on:
  push:
    branches: [main]
    paths:
      - effects-runtime/**
      - CMakeLists.txt
      - sdk.lock
      - tools/fetch_sdk.py
      - .github/workflows/effects-runtime.yml
  workflow_dispatch: {}

concurrency:
  group: effects-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: macos-x86_64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            skip_tests: true
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ninja
        run: python -m pip install ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Fetch official SDK
        shell: bash
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        shell: bash
        run: cmake --build build --parallel
      - name: Normalize package text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("build/package/graphics_effects_runtime")
          for path in root.rglob("*.md"):
              data = path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              path.write_bytes(data)
          PY
      - name: Package platform
        shell: bash
        run: |
          mkdir -p dist
          python "$SDK/tools/package_mod.py" build/package/graphics_effects_runtime -o dist
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: effects-${{ matrix.name }}
          path: dist/*.zip

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official SDK
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: effects-*
          path: dist
          merge-multiple: true
      - name: Merge platforms
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("effects-runtime/openrac-mod.json"))["version"])')"
          python "$SDK/tools/package_mod.py" --merge dist/graphics-effects-runtime-"$VERSION"-*.zip -o dist/graphics-effects-runtime-"$VERSION".zip
          (cd dist && sha256sum graphics-effects-runtime-"$VERSION".zip > SHA256SUMS)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-effects-runtime
          path: |
            dist/graphics-effects-runtime-*.zip
            dist/SHA256SUMS
      - name: Publish runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="effects-runtime-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/graphics-effects-runtime-"$VERSION".zip dist/SHA256SUMS
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Graphics Effects Runtime $VERSION"               --notes "Official OpenRAC SDK runtime for particles, glow and heat haze authored by Graphics preparation. Works with the standard Dev Launcher."               dist/graphics-effects-runtime-"$VERSION".zip dist/SHA256SUMS
          fi
