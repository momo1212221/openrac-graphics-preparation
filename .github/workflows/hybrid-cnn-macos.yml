name: Hybrid Bloom CNN macOS test package
on:
  push:
    branches:
      - feat/hybrid-bloom-cnn-usable-20261110
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools and prepare local WebGPU/WASM runtime
        run: |
          python -m pip install ninja
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:webai
      - name: Download pinned local Real-ESRGAN models
        run: |
          mkdir -p models
          curl -L --fail --retry 5 --output models/realesrgan-x4plus.onnx "https://huggingface.co/qualcomm/Real-ESRGAN-x4plus/resolve/725b1db7360e0befb85be5ca9924d8c1e9b1b229/Real-ESRGAN-x4plus.onnx"
          echo "a64fb7ec8780e6e67a99cf380067961a0aab618c934171240eea2724217fd304  models/realesrgan-x4plus.onnx" | shasum -a 256 -c -
          curl -L --fail --retry 5 --output models/realesrgan-general-x4v3.onnx "https://huggingface.co/qualcomm/Real-ESRGAN-General-x4v3/resolve/fe119b62b7cb27c3fa5fd3d992122f8e5a3a52c4/Real-ESRGAN-General-x4v3.onnx"
          echo "bea98dff749104082449888501454b85a05ace135c89249599caec7ef2dace23  models/realesrgan-general-x4v3.onnx" | shasum -a 256 -c -
      - name: Test CNN code and existing graphics pipeline
        run: node --test
      - name: Fetch official OpenRAC mod SDK
        run: |
          echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Build native macOS Apple Silicon mod runtime
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --target graphics_preparation_runtime graphics_effects_config_test --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Build installable Graphics preparation 0.21.4 macOS ZIP
        env:
          OPENRAC_NATIVE_PACKAGE: build/package/graphics_preparation_runtime
          OPENRAC_REQUIRE_AI_ASSETS: "1"
        run: |
          python tools/package.py
          test -s dist/graphics-preparation-0.21.4-macos-arm64.zip
          ls -lh dist/graphics-preparation-0.21.4-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-preparation-0.21.4-macos-arm64-hybrid-cnn
          path: dist/graphics-preparation-0.21.4-macos-arm64.zip
          retention-days: 30
          if-no-files-found: error
